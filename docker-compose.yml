services:
  api:
    build:
      context: ./app
      dockerfile: ../docker/Dockerfile
      args:
        APP_VERSION: local
    image: pulse-api:local
    environment:
      PORT: 3000
      SHUTDOWN_DELAY_MS: 1000
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
